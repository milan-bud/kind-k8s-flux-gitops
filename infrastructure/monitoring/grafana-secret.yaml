apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin-credentials
  namespace: flux-system
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: grafana-admin-credentials # name of the K8s secret
    creationPolicy: Owner
  data:
  - secretKey: admin-password
    remoteRef:
      key: secret/data/grafana # path in Vault
      property: password
