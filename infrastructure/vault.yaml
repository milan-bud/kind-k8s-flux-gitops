apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vault
  namespace: flux-system
spec:
  interval: 1h
  chart:
    spec:
      chart: vault
      sourceRef:
        kind: HelmRepository
        name: hashicorp
        namespace: flux-system
  values:
    server:
      dev:
        enabled: true
      # enable a PostStart hook to auto-configure Kubernetes auth
      postStart:
        - [/bin/sh, -c, "sleep 5 && vault auth enable kubernetes"]
