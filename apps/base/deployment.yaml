apiVersion: apps/v1
kind: Deployment
metadata:
  name: webapp
spec:
  selector:
    match_labels:
      app: webapp
  template:
    metadata:
      labels:
        app: webapp
    spec:
      # custom ServiceAccount
      serviceAccountName: webapp-sa
      containers:
      - name: nginx
        image: nginx:1.25.0 # just to test automation later
        ports:
        - containerPort: 80
