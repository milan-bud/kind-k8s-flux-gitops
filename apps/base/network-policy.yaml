apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-monitoring-and-ingress
  namespace: flux-system 
spec:
  podSelector: {} # Applies to all pods in the namespace/app
  policyTypes:
    - Ingress
  ingress:
    # Allow traffic from Prometheus (monitoring)
    - from:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: flux-system
      - podSelector:
          matchLabels:
            app.kubernetes.io/name: prometheus
    # Allow traffic from Ingress Controller (if you have one)
    # or allow internal traffic between apps
    - from:
      - podSelector: {}
