---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: external-secrets
  namespace: flux-system
spec:
  interval: 1h
  path: ./infrastructure/operator 
  prune: true
  wait: true
  timeout: 5m 
  sourceRef:
    kind: GitRepository
    name: flux-system

---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure-vault
  namespace: flux-system
spec:
  force: true
  dependsOn:
    - name: external-secrets
  interval: 1h
  timeout: 5m 
  retryInterval: 2m
  path: ./infrastructure/vault
  prune: true
  wait: true 
  sourceRef:
    kind: GitRepository
    name: flux-system

---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure-monitoring
  namespace: flux-system
spec:
  force: true
  dependsOn:
    - name: external-secrets
  interval: 1h
  path: ./infrastructure
  prune: true
  wait: true 
  sourceRef:
    kind: GitRepository
    name: flux-system
