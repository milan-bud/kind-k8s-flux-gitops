apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: webapp-test
  namespace: flux-system
spec:
  interval: 1m
  path: ./apps/overlays/test
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  targetNamespace: test
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: webapp-production
  namespace: flux-system
spec:
  interval: 1m
  path: ./apps/overlays/production
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  targetNamespace: production
